<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blunt Force">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Blunt Force — Lights Out</title>
<style>
:root{--bg:#F2F2F7;--card:#ffffff;--text:#1C1C1E;--gray:60,60,67;--navbg:rgba(242,242,247,0.94)}
@media (prefers-color-scheme:dark){
:root{--bg:#000000;--card:#1C1C1E;--text:#ffffff;--gray:235,235,245;--navbg:rgba(22,22,24,0.94)}
.ios-card{box-shadow:none}
.yt-pill,.yt-link{background:rgba(255,69,58,0.12);border-color:rgba(255,69,58,0.3);color:#FF6961}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overscroll-behavior:none;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}
input{-webkit-appearance:none;border:none;outline:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
a{text-decoration:none}

/* NAV */
.sticky-nav{position:sticky;top:0;z-index:300;background:var(--navbg);backdrop-filter:blur(20px);border-bottom:1px solid rgba(var(--gray),0.1)}
.nav-scroll{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-scroll::-webkit-scrollbar{display:none}

/* WEEK BAR */
.week-bar{display:flex;gap:3px;padding:10px 16px 0;align-items:center}
.wb-seg{flex:1;height:3px;border-radius:2px;background:rgba(120,120,128,0.2);cursor:pointer;transition:background 0.2s}
.wb-seg.past{background:rgba(var(--gray),0.3)}
.wb-seg.now{background:#FF3B30}
.wb-seg.now.s2{background:#FF9500}

/* TABS */
.wk-btn{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:600;color:rgba(var(--gray),0.6);border-bottom:2px solid transparent;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:1px}
.wk-btn.on{color:#FF3B30;border-bottom-color:#FF3B30}
.wk-btn.on.s2{color:#FF9500;border-bottom-color:#FF9500}
.wk-sub{font-size:9px;font-weight:400;color:rgba(var(--gray),0.3)}
.dy-btn{flex-shrink:0;padding:8px 13px;font-size:14px;font-weight:600;color:rgba(var(--gray),0.6);border-bottom:2px solid transparent;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:1px}
.dy-btn.on{color:#FF3B30;border-bottom-color:#FF3B30}
.dy-sub{font-size:9px;font-weight:400;color:rgba(var(--gray),0.3);text-transform:uppercase;letter-spacing:0.3px}

/* CONTENT */
.content{padding:12px 16px;padding-bottom:90px;max-width:600px}

/* CARDS */
.ios-card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,0.04)}
.sep{border-bottom:1px solid rgba(var(--gray),0.06)}

/* PHASE BANNER */
.phase-banner{background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.pb-name{font-weight:600;font-size:13px;margin-bottom:2px}
.pb-desc{font-size:12px;color:rgba(var(--gray),0.6);line-height:1.4}

/* INFO BAND */
.info-band{border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12px;line-height:1.5}
.info-band strong{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:2px}

/* WARMUP */
.wu-toggle{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;text-align:left}
.wu-title{font-size:14px;font-weight:600;color:var(--text)}
.wu-sub{font-size:12px;color:rgba(var(--gray),0.6);margin-top:1px}
.wu-arr{margin-left:auto;color:rgba(var(--gray),0.3);font-size:16px;transition:transform 0.2s;line-height:1}
.wu-arr.open{transform:rotate(90deg);color:var(--text)}
.wu-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px}
.wu-num{width:22px;height:22px;border-radius:11px;background:rgba(120,120,128,0.12);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(var(--gray),0.6);flex-shrink:0}
.wu-name{font-size:13px;font-weight:600;color:var(--text)}
.wu-reps{font-size:12px;color:#FF3B30;margin-top:1px;font-weight:500}
.wu-cue{font-size:11px;color:rgba(var(--gray),0.6);margin-top:2px;line-height:1.4}
.yt-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(255,0,0,0.06);border:1px solid rgba(255,0,0,0.15);color:#cc2020;margin-top:4px}
.ramp{padding:8px 16px;font-size:11px;color:rgba(var(--gray),0.5);background:rgba(120,120,128,0.08)}

/* SS DIVIDER */
.ss-div{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.ss-line{flex:1;height:1px;background:rgba(var(--gray),0.08)}
.ss-txt{font-size:11px;font-weight:700;color:rgba(var(--gray),0.5);text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap}
.ss-note{font-size:10px;color:rgba(var(--gray),0.35)}

/* EXERCISE */
.ex-card{background:var(--card);margin-bottom:1px;transition:all 0.15s}
.ex-card.corr{border-left:3px solid rgba(120,120,128,0.2);opacity:0.88}
.ex-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.ex-hdr:active{background:rgba(120,120,128,0.06)}
.ex-lbl{font-weight:800;font-size:16px;color:rgba(var(--gray),0.3);width:26px;flex-shrink:0;text-align:center}
.ex-card.open .ex-lbl{color:#FF3B30}
.ex-name{font-weight:600;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-card.corr .ex-name{color:rgba(var(--gray),0.6)}
.ex-schematic{font-size:12px;color:#FF3B30;margin-top:1px;font-weight:500}
.ex-card.corr .ex-schematic{color:rgba(var(--gray),0.4)}
.ex-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;display:inline-block}
.rest-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;background:rgba(120,120,128,0.12);border:1px solid rgba(var(--gray),0.1);color:rgba(var(--gray),0.6);font-size:12px;font-weight:600;flex-shrink:0;white-space:nowrap;transition:all 0.15s}
.rest-btn.running{background:rgba(255,59,48,0.1);border-color:rgba(255,59,48,0.3);color:#FF3B30}
.ex-arr{color:rgba(var(--gray),0.25);font-size:16px;margin-left:4px;transition:transform 0.2s;line-height:1;flex-shrink:0}
.ex-card.open .ex-arr{transform:rotate(90deg);color:var(--text)}

/* EXPANDED */
.note-inp{width:100%;background:none;font-size:14px;color:var(--text);padding:8px 16px}
.note-inp::placeholder{color:rgba(var(--gray),0.3)}
.set-hdr{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;padding:6px 16px 4px}
.set-hdr-cell{font-size:12px;font-weight:600;color:rgba(var(--gray),0.5);text-align:center;text-transform:uppercase;letter-spacing:0.3px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;padding:6px 16px;align-items:center;transition:background 0.2s}
.set-row.done{background:rgba(52,199,89,0.06)}
.set-num{font-weight:700;font-size:15px;color:rgba(var(--gray),0.5);text-align:center}
.set-row.done .set-num{color:#34C759}
.set-inp{background:rgba(120,120,128,0.12);border-radius:8px;padding:7px 0;text-align:center;font-size:16px;font-weight:600;color:var(--text);width:100%;-moz-appearance:textfield}
.set-inp::-webkit-inner-spin-button,.set-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.set-row.done .set-inp{background:rgba(52,199,89,0.1);color:#34C759}
.set-check{width:32px;height:32px;border-radius:16px;border:1.5px solid rgba(120,120,128,0.2);background:transparent;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer;transition:all 0.15s;font-size:14px;font-weight:700}
.set-check.done{background:#34C759;border-color:#34C759;color:#fff}
.set-actions{display:flex;align-items:center;gap:8px;padding:10px 16px}
.add-set-btn{color:#007AFF;font-size:14px;font-weight:600}
.yt-link{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(255,0,0,0.06);border:1px solid rgba(255,0,0,0.15);color:#cc2020}
.rm-btn{font-size:12px;color:rgba(var(--gray),0.4);margin-left:4px}
.cue-box{padding:10px 16px;background:rgba(120,120,128,0.08)}
.cue-lbl{font-size:11px;font-weight:700;color:#FF3B30;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
.cue-txt{font-size:13px;color:rgba(var(--gray),0.6);line-height:1.5}

/* TIMER */
.timer-sheet{position:fixed;bottom:76px;left:12px;right:12px;z-index:500;background:rgba(28,28,30,0.97);backdrop-filter:blur(20px);border-radius:16px;padding:16px 16px 12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.timer-lbl{font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.timer-num{font-size:52px;font-weight:700;letter-spacing:-2px;text-align:center;line-height:1;color:#fff;margin-bottom:8px}
.timer-num.hot{color:#FF3B30}
.timer-num.done{color:#34C759}
.timer-track{height:3px;background:rgba(255,255,255,0.12);border-radius:2px;margin-bottom:12px;overflow:hidden}
.timer-fill{height:100%;background:#fff;border-radius:2px;transition:width 0.5s linear,background 0.3s}
.timer-fill.hot{background:#FF3B30}
.timer-fill.done{background:#34C759}
.timer-btns{display:flex;gap:8px}
.timer-btn{flex:1;padding:8px 0;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:600}
.timer-btn.dismiss{flex:2;background:#fff;color:#000;font-weight:700}

/* RECOVERY */
.rec-item{display:flex;align-items:flex-start;gap:12px;padding:10px 16px}
.rec-title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:2px}
.rec-desc{font-size:13px;color:rgba(var(--gray),0.6);line-height:1.4}

/* PROGRESS */
.prog-weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px}
.pw{background:rgba(120,120,128,0.08);border:1px solid rgba(120,120,128,0.1);border-radius:8px;padding:6px 4px;text-align:center}
.pw.logged{background:var(--card);border-color:rgba(var(--gray),0.15)}
.pw-l{font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px;color:rgba(var(--gray),0.5)}
.pw-v{font-weight:800;font-size:14px;color:var(--text)}
.pw-s{font-size:9px;color:rgba(var(--gray),0.4);margin-top:1px}

/* COND */
.cond-row{display:flex;align-items:center;gap:10px;padding:10px 16px}
.cond-num{font-weight:800;font-size:16px;color:rgba(var(--gray),0.2);width:22px;text-align:center;flex-shrink:0}

/* SCHEDULE */
.sched-row{display:flex;align-items:stretch;margin-bottom:4px;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.sched-row.today{box-shadow:0 0 0 2px #FF3B30}
.sched-day{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(120,120,128,0.06);border-right:1px solid rgba(var(--gray),0.06);font-weight:700;font-size:13px;color:rgba(var(--gray),0.6)}
.sched-row.today .sched-day{background:#FF3B30;color:#fff}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--navbg);backdrop-filter:blur(20px);border-top:1px solid rgba(var(--gray),0.1);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nt{flex:1;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(var(--gray),0.4);transition:color 0.15s}
.nt.on{color:#007AFF}
.nt .ni{font-size:20px;line-height:1}
.nt .nl{font-size:10px;font-weight:500;letter-spacing:0.2px}

/* REST DAY */
.rest-view{text-align:center;padding:24px 0 16px}

/* GUIDE */
.gd-term{padding:12px 16px}
.gd-term-name{font-size:14px;font-weight:700;color:var(--text)}
.gd-term-def{font-size:13px;color:rgba(var(--gray),0.6);line-height:1.5;margin-top:2px}
.gd-week{display:flex;align-items:flex-start;gap:12px;padding:10px 16px}
.gd-week-badge{flex-shrink:0;width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.gd-week-name{font-size:14px;font-weight:600;color:var(--text)}
.gd-week-desc{font-size:12px;color:rgba(var(--gray),0.6);margin-top:2px;line-height:1.4}
</style>
</head>

  ]},
  {name:"Upper Body Strength",wu:"upper",ss:[

let S = {

  timer:{active:false,total:0,remaining:0,exId:null},
  timerIv:null,
};

function save(){ lsSet("lo_logs", S.logs); }
function lk(exId){ return `w${S.weekIdx}_d${S.dayIdx}_${exId}`; }
function getLog(exId){ return S.logs[lk(exId)] || {note:"",sets:[]}; }
function setLog(exId, data){
  S.logs[lk(exId)] = Object.assign({}, getLog(exId), data);
  save();
}

// ══════════════════════════════════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════════════════════════════════
function startTimer(sec, exId){
  if(S.timerIv) clearInterval(S.timerIv);
  S.timer = {active:true, total:sec, remaining:sec, exId:exId||null};
  S.timerIv = setInterval(()=>{
    S.timer.remaining--;
    if(S.timer.remaining <= 0){
      clearInterval(S.timerIv);
      S.timer.active = false;
      if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
    }
    render();
  }, 1000);
  render();
}
function addTime(s){ S.timer.remaining+=s; S.timer.total+=s; render(); }
function dismissTimer(){
  if(S.timerIv) clearInterval(S.timerIv);
  S.timer = {active:false,total:0,remaining:0,exId:null};
  render();
}

function yt(q){ return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`; }

function tag(type){
  const tc = TAG_COLORS[type]||TAG_COLORS.strength;
  return `<span class="tag" style="background:${tc.bg};color:${tc.color}">${type.toUpperCase()}</span>`;
}

function renderTimerSheet(){
  const t = S.timer;
  if(!t.active && t.remaining===0) return "";
  const m=Math.floor(t.remaining/60), s=t.remaining%60;
  const pct = t.total>0?(t.remaining/t.total*100):100;
  const isDone = !t.active && t.remaining===0 && t.total>0;
  const isHot = t.remaining<=10 && t.active;
  return `<div class="timer-sheet">
    <div class="timer-lbl">⏱ Rest Timer</div>
    <div class="timer-num ${isDone?'done':isHot?'hot':''}">${isDone?"GO!":`${m}:${String(s).padStart(2,"0")}`}</div>
    <div class="timer-track"><div class="timer-fill ${isDone?'done':isHot?'hot':''}" style="width:${isDone?100:pct}%"></div></div>
    <div class="timer-btns">
      <button class="timer-btn" onclick="addTime(30)">+30s</button>
      <button class="timer-btn" onclick="addTime(60)">+1min</button>
      <button class="timer-btn dismiss" onclick="dismissTimer()">Done ✓</button>
    </div>
  </div>`;
}

function renderExCard(ex, week){
  const data = week.phase===0 ? ex.s1 : ex.s2;
  const defSets = week.reset ? Math.max(2, parseInt(data.sets)-1) : parseInt(data.sets)||3;
  const log = getLog(ex.id);
  const sets = log.sets && log.sets.length>0 ? log.sets : Array(defSets).fill(0).map(()=>({kg:"",reps:"",done:false}));
  const completed = sets.filter(s=>s.done).length;
  const isOpen = S.openEx === ex.id;
  const restMin=Math.floor(ex.rest/60), restSec=ex.rest%60;
  const restLbl = restMin>0?`${restMin}:${String(restSec).padStart(2,"0")}`:`${ex.rest}s`;
  const isRunning = S.timer.exId===ex.id && S.timer.remaining>0;
  const tm=Math.floor((S.timer.remaining||0)/60), ts=(S.timer.remaining||0)%60;
  let setsLbl = `${defSets}×${data.reps}`;
  if(week.reset) setsLbl += " + 1×MAX";

  const setRows = sets.map((set,si)=>`
    <div class="set-row sep ${set.done?'done':''}" id="sr-${ex.id}-${si}">
      <div class="set-num">${si+1}</div>
      <input class="set-inp" type="text" inputmode="decimal" placeholder="—" value="${set.kg||''}"
        onchange="updateSet('${ex.id}',${si},'kg',this.value)" />
      <input class="set-inp" type="text" inputmode="numeric" placeholder="—" value="${set.reps||''}"
        onchange="updateSet('${ex.id}',${si},'reps',this.value)" />
      <div class="set-check ${set.done?'done':''}" onclick="toggleSet('${ex.id}',${si})">${set.done?'✓':''}</div>
    </div>`).join('');

  return `
    <div class="ex-card ios-card ${ex.corr?'corr':''} ${isOpen?'open':''}" id="exc-${ex.id}">
      <div class="ex-hdr" onclick="toggleEx('${ex.id}')">
        <div class="ex-lbl">${ex.lbl}</div>
        <div style="flex:1;min-width:0">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-schematic">${setsLbl} · ${data.load} · ${data.tempo}</div>
          <div class="ex-tags">
            ${(ex.type||[]).map(tag).join('')}
            ${completed>0?`<span class="tag" style="background:rgba(52,199,89,0.1);color:#34C759">${completed}/${sets.length} ✓</span>`:''}
          </div>
        </div>
        <button class="rest-btn ${isRunning?'running':''}" onclick="event.stopPropagation();startTimer(${ex.rest},'${ex.id}')">
          🔒 ${isRunning?`${tm}:${String(ts).padStart(2,"0")}`:restLbl}
        </button>
        <div class="ex-arr">›</div>
      </div>
      ${isOpen?`
        <div class="sep">
          <input class="note-inp" placeholder="Add note…" value="${(log.note||'').replace(/"/g,'&quot;')}"
            oninput="updateNote('${ex.id}',this.value)" />
        </div>
        <div class="set-hdr">
          <div class="set-hdr-cell">Set</div>
          <div class="set-hdr-cell">Kg / Lb</div>
          <div class="set-hdr-cell">Reps</div>
          <div class="set-hdr-cell"></div>
        </div>
        ${setRows}
        <div class="set-actions sep">
          <button class="add-set-btn" onclick="addSet('${ex.id}')">+ Add set</button>
          <a class="yt-link" href="${yt(ex.ytq)}" target="_blank" rel="noopener">▶ YouTube</a>
          ${sets.length>1?`<button class="rm-btn" onclick="removeSet('${ex.id}')">Remove last</button>`:''}
        </div>
        <div class="cue-box">
          <div class="cue-lbl">🥊 Blunt Force Cue</div>
          <div class="cue-txt">${ex.cue}</div>
        </div>
      `:''}
    </div>`;
}

              ? `<div style="font-size:13px;color:rgba(var(--gray),0.5);font-weight:500">🛌 Full Recovery — OFF</div>`
              : `<div style="font-size:13px;color:var(--text);font-weight:600;line-height:1.4">${s.pm}</div>`
            }
          </div>
          <div style="display:flex;align-items:center;padding-right:12px;color:rgba(var(--gray),0.25);font-size:16px">›</div>
        </div>`).join('')}
    </div>`;
}

const GLOSSARY=[
  {n:"% 1RM",d:"Percent of your One-Rep Max — the heaviest weight you can lift once. 85% 1RM means load up to 85% of that number."},
  {n:"Tempo [3|1|X]",d:"Seconds for each part of the lift: lowering | pause at the bottom | lifting. X means explode up as fast as possible. [3|1|X] = 3sec down, 1sec pause, explode up."},
  {n:"RPE",d:"Rate of Perceived Exertion, 1-10. RPE 8 means you could've done about 2 more reps before failing."},
  {n:"PAP (Post-Activation Potentiation)",d:"A heavy lift primes your nervous system, then an explosive move in the same pattern right after comes out more powerful. Stage 2 pairs use this."},
  {n:"Hypertrophy",d:"Training built to grow muscle size — moderate weight, more reps, slower tempo, full stretch under load."},
  {n:"Strength",d:"Training built to lift heavier — higher % 1RM, lower reps, longer rest between sets."},
  {n:"Power",d:"Training built for speed — lighter or bodyweight load, moved as fast/explosively as possible. This is what turns strength into punching and kicking power."},
  {n:"Corrective",d:"Lower-load exercises that keep joints (mostly shoulders and hips) healthy through 8 weeks of heavy training — not for building size or strength."},
];

function renderGuide(){
  return `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
        <div style="font-size:13px;font-weight:900;color:#FF3B30;letter-spacing:2px;text-transform:uppercase">BLUNT FORCE</div>
      </div>
      <div style="font-size:24px;font-weight:700;color:var(--text);letter-spacing:-0.5px">Guide</div>
      <div style="font-size:13px;color:rgba(var(--gray),0.5);margin-top:2px">What this plan is for, and how to read it.</div>
    </div>

    <div class="phase-banner ios-card">
      <span style="font-size:20px;margin-top:2px">🥊</span>
      <div>
        <div class="pb-name">What Blunt Force Is For</div>
        <div class="pb-desc">An 8-week strength-and-power block for striking athletes (Muay Thai / boxing). Weeks 1-4 build a strength base with hypertrophy and corrective work; weeks 5-8 convert that strength into explosive punching and kicking power using PAP pairs. Each lifting day is followed by bag work or conditioning so strength carries straight into the sport.</div>
      </div>
    </div>

    <div class="ss-div"><div class="ss-line"></div><div class="ss-txt">Terms You'll See</div><div class="ss-line"></div></div>
    <div class="ios-card">${GLOSSARY.map((g,i)=>`
      <div class="gd-term ${i<GLOSSARY.length-1?'sep':''}">
        <div class="gd-term-name">${g.n}</div>
        <div class="gd-term-def">${g.d}</div>
      </div>`).join('')}</div>

    <div class="ss-div"><div class="ss-line"></div><div class="ss-txt">Point of Each Week</div><div class="ss-line"></div></div>
    <div class="ios-card">${WEEKS.map((w,i)=>`
      <div class="gd-week ${i<WEEKS.length-1?'sep':''}">
        <div class="gd-week-badge" style="background:${w.phase===1?'#FF9500':'#FF3B30'}">${w.l}</div>
        <div>
          <div class="gd-week-name">${w.n}</div>
          <div class="gd-week-desc">${w.reset?"Drop a set, push the last set of each compound to failure, log it as a baseline before the next stage.":w.phase===1?"PAP pairing — heavy compound lift immediately followed by an explosive version of the same movement, for max power output.":"Builds the strength base — compound lifts at 70-85% 1RM, paired with correctives to keep joints healthy."}</div>
        </div>
      </div>`).join('')}</div>`;
}

// ══════════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════════════════════════════════════════
function render(){
  const week = WEEKS[S.weekIdx];
  const phColor = week.phase===1?"#FF9500":"#FF3B30";
  const dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const daySubs=["Lower","Upper","Plyos","Hyper","L.Pwr","Full","REST"];

  // Week bar
  const weekBar = `<div class="week-bar">
    <span style="font-size:10px;font-weight:600;color:rgba(var(--gray),0.5);margin-right:4px;letter-spacing:0.5px">8WK</span>
    ${WEEKS.map((w,i)=>`<div class="wb-seg ${i<S.weekIdx?'past':i===S.weekIdx?'now'+(w.phase===1?' s2':''):''}" onclick="selWeek(${i})"></div>`).join('')}
  </div>`;

  // Week tabs
  const weekTabs = `<div class="nav-scroll" style="border-bottom:1px solid rgba(var(--gray),0.06)">
    ${WEEKS.map((w,i)=>`<button class="wk-btn ${i===S.weekIdx?'on'+(w.phase===1?' s2':''):''}" onclick="selWeek(${i})">
      ${w.l}<span class="wk-sub">${w.n.split(" ")[0]}</span>
    </button>`).join('')}
  </div>`;

  // Day tabs
  const dayTabs = `<div class="nav-scroll">
    ${dayNames.map((d,i)=>`<button class="dy-btn ${i===S.dayIdx?'on':''}" onclick="selDay(${i})">
      ${d}<span class="dy-sub">${daySubs[i]}</span>
    </button>`).join('')}
  </div>`;

  // Content
  let content = "";
  if(S.dayIdx===6){
    content = renderRestDay();
  } else if(S.tab==="conditioning"){
    content = renderConditioning();
  } else if(S.tab==="progress"){
    content = renderProgress();
  } else if(S.tab==="schedule"){
    content = renderSchedule();
  } else if(S.tab==="guide"){
    content = renderGuide();
  } else {
    content = renderWorkout();
  }

  // Bottom nav
  const tabs = [
    {id:"workout",ico:"🥊",lbl:"Workout"},
    {id:"conditioning",ico:"🔥",lbl:"Conditioning"},
    {id:"progress",ico:"📊",lbl:"Progress"},
    {id:"schedule",ico:"📋",lbl:"Schedule"},
    {id:"guide",ico:"📖",lbl:"Guide"},
  ];
  const botNav = `<div class="bottom-nav">
    ${tabs.map(t=>`<button class="nt ${S.tab===t.id?'on':''}" onclick="S.tab='${t.id}';render()">
      <span class="ni">${t.ico}</span><span class="nl">${t.lbl}</span>
    </button>`).join('')}
  </div>`;

  document.getElementById('app').innerHTML = `
    <div class="sticky-nav">
      ${weekBar}${weekTabs}${dayTabs}
    </div>
    <div class="content">${content}</div>
    ${renderTimerSheet()}
    ${botNav}
  `;

  // Re-attach inputs after render
  document.querySelectorAll('input.note-inp').forEach(inp=>{
    inp.addEventListener('input', ()=>updateNote(inp.closest('[id^="exc-"]').id.replace('exc-',''), inp.value));
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════════════════════
function selWeek(i){ S.weekIdx=i; S.openEx=null; S.showWu=false; render(); }
function selDay(i){ S.dayIdx=i; S.openEx=null; S.showWu=false; render(); }
function toggleWu(){ S.showWu=!S.showWu; render(); }

function toggleEx(id){
  S.openEx = S.openEx===id ? null : id;
  render();
  if(S.openEx){
    setTimeout(()=>{
      const el=document.getElementById('exc-'+id);
      if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
    },60);
  }
}

function updateNote(exId, val){
  const log = getLog(exId);
  log.note = val;
  S.logs[lk(exId)] = log;
  save();
}

function updateSet(exId, si, field, val){
  const log = getLog(exId);
  const week = WEEKS[S.weekIdx];
  const day = PROGRAM[S.dayIdx%PROGRAM.length];
  const ex = day.ss.flatMap(ss=>ss.exs).find(e=>e.id===exId);
  const data = week.phase===0?ex.s1:ex.s2;
  const defSets = week.reset?Math.max(2,parseInt(data.sets)-1):parseInt(data.sets)||3;
  const sets = log.sets&&log.sets.length>0?[...log.sets]:Array(defSets).fill(0).map(()=>({kg:"",reps:"",done:false}));
  if(sets[si]) sets[si][field]=val;
  log.sets=sets;
  S.logs[lk(exId)]=log;
  save();
}

function toggleSet(exId, si){
  const log = getLog(exId);
  const week = WEEKS[S.weekIdx];
  const day = PROGRAM[S.dayIdx%PROGRAM.length];
  const ex = day.ss.flatMap(ss=>ss.exs).find(e=>e.id===exId);
  const data = week.phase===0?ex.s1:ex.s2;
  const defSets = week.reset?Math.max(2,parseInt(data.sets)-1):parseInt(data.sets)||3;
  const sets = log.sets&&log.sets.length>0?[...log.sets]:Array(defSets).fill(0).map(()=>({kg:"",reps:"",done:false}));
  if(sets[si]) sets[si].done=!sets[si].done;
  log.sets=sets;
  S.logs[lk(exId)]=log;
  save();
  // Partial re-render of just this row
  const row=document.getElementById(`sr-${exId}-${si}`);
  if(row){
    row.className=`set-row sep${sets[si].done?' done':''}`;
    const check=row.querySelector('.set-check');
    if(check){check.className=`set-check${sets[si].done?' done':''}`;check.textContent=sets[si].done?'✓':'';}
    row.querySelectorAll('.set-inp').forEach(inp=>inp.style.background=sets[si].done?'rgba(52,199,89,0.1)':'rgba(120,120,128,0.12)');
    // Update completed count badge
    const card=document.getElementById('exc-'+exId);
    if(card){
      const completedNow=sets.filter(s=>s.done).length;
      const badgeSpans=card.querySelectorAll('.tag');
      badgeSpans.forEach(sp=>{if(sp.style.color==="#34C759"||sp.textContent.includes("✓")){sp.textContent=`${completedNow}/${sets.length} ✓`;}});
    }
  }
}

function addSet(exId){
  const log=getLog(exId);
  const week=WEEKS[S.weekIdx];
  const day=PROGRAM[S.dayIdx%PROGRAM.length];
  const ex=day.ss.flatMap(ss=>ss.exs).find(e=>e.id===exId);
  const data=week.phase===0?ex.s1:ex.s2;
  const defSets=week.reset?Math.max(2,parseInt(data.sets)-1):parseInt(data.sets)||3;
  const sets=log.sets&&log.sets.length>0?[...log.sets]:Array(defSets).fill(0).map(()=>({kg:"",reps:"",done:false}));
  const last=sets[sets.length-1]||{};
  sets.push({kg:last.kg||"",reps:last.reps||"",done:false});
  log.sets=sets;
  S.logs[lk(exId)]=log;
  save();
  render();
}

function removeSet(exId){
  const log=getLog(exId);
  if(log.sets&&log.sets.length>1){
    log.sets=log.sets.slice(0,-1);
    S.logs[lk(exId)]=log;
    save();
    render();
  }
}

// PWA service worker
if('serviceWorker' in navigator){
  const sw=`const C='lo4';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./')))))`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// INIT
render();
</script>
